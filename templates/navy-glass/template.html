<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="canvas">

    <!-- Full background image (navy gradient + bottom sphere + nurse) -->
    <img class="bg" src="background.png" alt="" onerror="this.style.display='none'" />

    <!-- Logo (top center) removed as requested -->

    <!-- Hero title -->
    <div class="hero">
      <div class="slot title" data-field="title" data-min-size="52" data-max-size="96"></div>
    </div>

    <!-- Frosted glass panel -->
    <div class="glass">

      <div class="row align-center">
        <span class="label">JOB ID :</span>
        <div class="slot value" data-field="job_id" data-min-size="24" data-max-size="36"></div>
        <div class="cos-wrap">
          <div class="slot cos-badge" data-field="cos" data-min-size="18" data-max-size="24"></div>
        </div>
      </div>

      <div class="row">
        <span class="label">JOB TITLE :</span>
        <div class="slot value" data-field="job_title" data-min-size="24" data-max-size="36"></div>
      </div>

      <div class="row">
        <span class="label">LOCATION :</span>
        <div class="slot value" data-field="location" data-min-size="24" data-max-size="36"></div>
      </div>

      <div class="row">
        <span class="label">SALARY :</span>
        <div class="slot value" data-field="salary" data-min-size="22" data-max-size="34"></div>
      </div>
      <!-- CTA + website on same row -->
      <div class="cta-row">
        <div class="slot cta" data-field="cta" data-min-size="20" data-max-size="28"></div>
        <div class="slot website" data-field="website" data-min-size="16" data-max-size="22"></div>
      </div>
    </div>



  </div>
</body>

</html>
