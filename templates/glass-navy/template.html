<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="canvas">
    <img src="background.png" class="bg" alt="" />
    <div class="bg-blob bg-blob--tl"></div>
    <div class="bg-blob bg-blob--br"></div>
    <svg class="dots dots--tr" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dotgrid" x="0" y="0" width="34" height="34" patternUnits="userSpaceOnUse">
          <circle cx="6" cy="6" r="5" fill="#FFFFFF" />
        </pattern>
      </defs>
      <rect width="200" height="200" fill="url(#dotgrid)" />
    </svg>
    <!-- <img class="nurse" src="nurse.png" alt="" onerror="this.style.display='none'" /> -->
    <div class="logo">
      <img class="logo-img" src="logo.png" alt="" onerror="this.style.display='none'" />
    </div>
    <div class="slot title" data-field="title" data-min-size="52" data-max-size="92"></div>
    <div class="glass-panel">
      <div class="info-row info-row--id">
        <div class="info-inline">
          <span class="info-label">JOB ID:</span>
          <div class="slot info-value" data-field="job_id" data-min-size="26" data-max-size="40">
          </div>
        </div>
        <div class="slot cos-badge" data-field="cos" data-min-size="20" data-max-size="28"></div>
      </div>
      <div class="info-row">
        <span class="info-label">JOB TITLE:</span>
        <div class="slot info-value info-value--lg" data-field="job_title" data-min-size="24" data-max-size="38"
         ></div>
      </div>
      <div class="info-row">
        <span class="info-label">LOCATION:</span>
        <div class="slot info-value info-value--lg" data-field="location" data-min-size="24" data-max-size="38"
         ></div>
      </div>
      <div class="info-row">
        <span class="info-label">SALARY:</span>
        <div class="slot info-value info-value--md" data-field="salary" data-min-size="22" data-max-size="34"
         ></div>
      </div>
    </div>
    <div class="footer">
      <div class="slot website" data-field="website" data-min-size="18" data-max-size="24"></div>
    </div>
  </div>
</body>

</html>
