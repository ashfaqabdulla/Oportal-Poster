services:
  posterforge:
    build: .
    container_name: posterforge
    network_mode: host
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=8433
    shm_size: '1gb'          # Prevents Chromium crashes
    mem_limit: 2g            # Adjust based on your server
    restart: unless-stopped
