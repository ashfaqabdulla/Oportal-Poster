services:
  posterforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posterforge
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    shm_size: 1gb
    mem_limit: 2g
    volumes:
      - posterforge_outputs:/app/public/outputs
    restart: unless-stopped

volumes:
  posterforge_outputs:
